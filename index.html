<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1C1B1A" />
<title>Focus &amp; Form — Workout Tracker</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Focus & Form" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #1C1B1A; }
  body { font-family: 'Inter', -apple-system, sans-serif; color: #EDEAE3; -webkit-tap-highlight-color: transparent; }
  input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
  ::-webkit-scrollbar { display: none; }
  button { font-family: inherit; }
  input:focus, button:focus { outline: 2px solid #D9A441; outline-offset: 1px; }
</style>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo } = React;

// ---------- Local storage adapter (mirrors the window.storage API shape) ----------
const storage = {
  get: async (key) => {
    const raw = localStorage.getItem(key);
    if (raw === null) return null;
    return { key, value: raw };
  },
  set: async (key, value) => {
    try {
      localStorage.setItem(key, value);
      return { key, value };
    } catch (e) {
      return null;
    }
  },
};

// ---------- Static program data ----------

const MUSCLE_COLORS = {
  Chest: "#C4694F", Back: "#3B6FA0", Shoulders: "#D9A441", Biceps: "#5C8A5C",
  Triceps: "#7A5C9E", Legs: "#B0563E", Glutes: "#8E6FB0", Hamstrings: "#4A7856",
  Core: "#6B7280", Calves: "#3B6FA0", Forearms: "#5C8A5C",
};

function primaryMuscleGroup(text) {
  const t = text.toLowerCase();
  if (t.includes("chest")) return "Chest";
  if (t.includes("lat") || t.includes("back") || t.includes("rhomboid") || t.includes("trap")) return "Back";
  if (t.includes("delt") || t.includes("shoulder")) return "Shoulders";
  if (t.includes("bicep")) return "Biceps";
  if (t.includes("tricep")) return "Triceps";
  if (t.includes("glute")) return "Glutes";
  if (t.includes("hamstring") || t.includes("posterior chain")) return "Hamstrings";
  if (t.includes("quad")) return "Legs";
  if (t.includes("calf") || t.includes("calves")) return "Calves";
  if (t.includes("core") || t.includes("ab")) return "Core";
  if (t.includes("forearm")) return "Forearms";
  return "Back";
}

const DAYS = [
  { id: "day1", label: "Day 1", name: "Upper Body", focus: "Chest, Back, Shoulders, Arms", color: "#3B6FA0",
    exercises: [
      { name: "Bench Press", sets: 4, reps: "6–8", muscles: "Chest, Triceps, Front Delts" },
      { name: "Pull-Ups / Lat Pulldown", sets: 4, reps: "8–10", muscles: "Lats, Biceps, Upper Back" },
      { name: "Incline Dumbbell Press", sets: 3, reps: "8–10", muscles: "Upper Chest, Front Delts" },
      { name: "Seated Cable Row", sets: 3, reps: "8–12", muscles: "Mid Back, Rhomboids" },
      { name: "Dumbbell Shoulder Press", sets: 3, reps: "8–10", muscles: "Shoulders (Overall)" },
      { name: "Lateral Raises", sets: 3, reps: "12–15", muscles: "Side Delts" },
      { name: "Barbell / EZ Curl", sets: 3, reps: "10–12", muscles: "Biceps" },
      { name: "Triceps Pushdown", sets: 3, reps: "10–12", muscles: "Triceps" },
      { name: "Face Pulls", sets: 2, reps: "12–15", muscles: "Rear Delts, Upper Back" },
      { name: "Hammer Curl (Optional)", sets: 2, reps: "10–12", muscles: "Biceps, Forearms" },
    ]},
  { id: "day2", label: "Day 2", name: "Lower Body", focus: "Legs, Glutes, Hamstrings, Core", color: "#4A7856",
    exercises: [
      { name: "Back Squat", sets: 4, reps: "6–10", muscles: "Quads, Glutes, Hamstrings" },
      { name: "Romanian Deadlift", sets: 4, reps: "8–10", muscles: "Hamstrings, Glutes, Lower Back" },
      { name: "Leg Press", sets: 3, reps: "10–12", muscles: "Quads, Glutes" },
      { name: "Leg Curl", sets: 3, reps: "10–15", muscles: "Hamstrings" },
      { name: "Walking Lunge", sets: 3, reps: "10–12", muscles: "Quads, Glutes" },
      { name: "Standing Calf Raise", sets: 4, reps: "12–15", muscles: "Calves" },
      { name: "Plank", sets: 3, reps: "30–60 sec", muscles: "Core (Abs, Obliques)" },
      { name: "Hanging Leg Raise", sets: 3, reps: "10–15", muscles: "Lower Abs" },
    ]},
  { id: "day3", label: "Day 3", name: "Full Body", focus: "Total Body, Strength & Aesthetics", color: "#7A5C9E",
    exercises: [
      { name: "Deadlift", sets: 3, reps: "5–8", muscles: "Full Posterior Chain" },
      { name: "Incline Dumbbell Press", sets: 3, reps: "8–10", muscles: "Upper Chest, Front Delts" },
      { name: "Pull-Ups / Lat Pulldown", sets: 3, reps: "8–10", muscles: "Lats, Biceps, Upper Back" },
      { name: "Dumbbell Bench Press", sets: 3, reps: "8–12", muscles: "Chest, Triceps, Front Delts" },
      { name: "Bent Over Row", sets: 3, reps: "8–12", muscles: "Mid Back, Lats, Biceps" },
      { name: "Lateral Raises", sets: 3, reps: "12–15", muscles: "Side Delts" },
      { name: "Bulgarian Split Squat", sets: 3, reps: "8–12", muscles: "Quads, Glutes" },
      { name: "Triceps Overhead Ext.", sets: 2, reps: "10–12", muscles: "Triceps" },
      { name: "Barbell / EZ Curl", sets: 2, reps: "10–12", muscles: "Biceps" },
      { name: "Cable Crunch", sets: 3, reps: "12–15", muscles: "Abs" },
    ]},
];

const TRAINING_NOTES = [
  "Rest 60–90 sec between sets (compounds), 45–60 sec (isolations)",
  "Focus on progressive overload every week",
  "Keep 1–2 reps in reserve on most sets",
  "Warm up before lifting and stretch after",
];

function todayISO() {
  const d = new Date();
  const tz = d.getTimezoneOffset() * 60000;
  return new Date(d - tz).toISOString().slice(0, 10);
}

function formatDateLabel(iso) {
  const d = new Date(iso + "T00:00:00");
  return d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
}

function logKey(date, dayId) { return `log:${date}:${dayId}`; }

const DEFAULT_REST_SEC = 90;
function formatClock(sec) {
  const m = Math.floor(sec / 60);
  return `${m}:${String(sec % 60).padStart(2, "0")}`;
}

// Small hand-drawn icon set — no external dependency, so nothing to fail to load.
function svgBase(size, color, strokeWidth, children) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
      strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round"
      style={{ display: "inline-block", verticalAlign: "middle" }}>
      {children}
    </svg>
  );
}

const Check = ({ size = 16, color = "currentColor", strokeWidth = 2 }) =>
  svgBase(size, color, strokeWidth, <polyline points="20 6 9 17 4 12" />);

const ChevronDown = ({ size = 16, color = "currentColor", strokeWidth = 2 }) =>
  svgBase(size, color, strokeWidth, <polyline points="6 9 12 15 18 9" />);

const ChevronUp = ({ size = 16, color = "currentColor", strokeWidth = 2 }) =>
  svgBase(size, color, strokeWidth, <polyline points="18 15 12 9 6 15" />);

const TrendingUp = ({ size = 16, color = "currentColor", strokeWidth = 2 }) =>
  svgBase(size, color, strokeWidth, <React.Fragment>
    <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
    <polyline points="17 6 23 6 23 12" />
  </React.Fragment>);

const Scale = ({ size = 16, color = "currentColor", strokeWidth = 2 }) =>
  svgBase(size, color, strokeWidth, <React.Fragment>
    <line x1="12" y1="3" x2="12" y2="21" />
    <line x1="4" y1="7" x2="20" y2="7" />
    <path d="M4 7l3 7a3 3 0 0 0 6 0L4 7" />
    <path d="M20 7l-3 7a3 3 0 0 1-6 0L20 7" />
  </React.Fragment>);

const Dumbbell = ({ size = 16, color = "currentColor", strokeWidth = 2 }) =>
  svgBase(size, color, strokeWidth, <React.Fragment>
    <rect x="2" y="9" width="3" height="6" rx="1" />
    <rect x="19" y="9" width="3" height="6" rx="1" />
    <rect x="5" y="7" width="3" height="10" rx="1" />
    <rect x="16" y="7" width="3" height="10" rx="1" />
    <line x1="8" y1="12" x2="16" y2="12" />
  </React.Fragment>);

const Calendar = ({ size = 16, color = "currentColor", strokeWidth = 2 }) =>
  svgBase(size, color, strokeWidth, <React.Fragment>
    <rect x="3" y="4" width="18" height="18" rx="2" />
    <line x1="16" y1="2" x2="16" y2="6" />
    <line x1="8" y1="2" x2="8" y2="6" />
    <line x1="3" y1="10" x2="21" y2="10" />
  </React.Fragment>);

const Timer = ({ size = 16, color = "currentColor", strokeWidth = 2 }) =>
  svgBase(size, color, strokeWidth, <React.Fragment>
    <circle cx="12" cy="14" r="8" /><path d="M12 10v4l2 2" /><path d="M10 2h4" />
  </React.Fragment>);

function IconWrap({ icon: Icon, size, color, strokeWidth }) {
  return <Icon size={size} color={color} strokeWidth={strokeWidth} />;
}

function App() {
  const [activeDay, setActiveDay] = useState("day1");
  const [date, setDate] = useState(todayISO());
  const [log, setLog] = useState(null);
  const [expanded, setExpanded] = useState(0);
  const [loading, setLoading] = useState(true);
  const [saveError, setSaveError] = useState(false);
  const [view, setView] = useState("log");
  const [bodyWeights, setBodyWeights] = useState({});
  const [bwInput, setBwInput] = useState("");
  const [historyDates, setHistoryDates] = useState([]);
  // Active rest countdown: { date, dayId, exIdx, setIdx, endAt, alerted } — only one at a time.
  const [rest, setRest] = useState(null);
  const [now, setNow] = useState(Date.now());
  const [restDurations, setRestDurations] = useState({});

  const day = DAYS.find((d) => d.id === activeDay);

  useEffect(() => {
    let cancelled = false;
    setLoading(true);
    (async () => {
      try {
        const result = await storage.get(logKey(date, activeDay));
        if (!cancelled) setLog(result ? JSON.parse(result.value) : {});
      } catch (e) {
        if (!cancelled) setLog({});
      } finally {
        if (!cancelled) setLoading(false);
      }
    })();
    return () => { cancelled = true; };
  }, [date, activeDay]);

  useEffect(() => {
    try {
      const raw = localStorage.getItem("rest-durations");
      if (raw) setRestDurations(JSON.parse(raw));
    } catch (e) {}
  }, []);

  // Tick while a rest is running; remaining time is derived from endAt so it stays
  // correct even if the phone locks or the tab is backgrounded.
  useEffect(() => {
    if (!rest) return;
    setNow(Date.now());
    const id = setInterval(() => setNow(Date.now()), 250);
    return () => clearInterval(id);
  }, [rest]);

  useEffect(() => {
    if (rest && !rest.alerted && now >= rest.endAt) {
      try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {}
      setRest({ ...rest, alerted: true });
    }
  }, [now, rest]);

  useEffect(() => {
    (async () => {
      try {
        const result = await storage.get("bodyweight-log");
        if (result) setBodyWeights(JSON.parse(result.value));
      } catch (e) {}
    })();
  }, []);

  useEffect(() => {
    (async () => {
      try {
        const result = await storage.get("history-index");
        if (result) setHistoryDates(JSON.parse(result.value));
      } catch (e) {}
    })();
  }, []);

  const persistLog = useCallback(async (newLog) => {
    setLog(newLog);
    try {
      const res = await storage.set(logKey(date, activeDay), JSON.stringify(newLog));
      if (!res) throw new Error("save failed");
      setSaveError(false);
      const exists = historyDates.some((h) => h.date === date && h.dayId === activeDay);
      if (!exists) {
        const newIndex = [...historyDates, { date, dayId: activeDay }];
        setHistoryDates(newIndex);
        await storage.set("history-index", JSON.stringify(newIndex));
      }
    } catch (e) {
      setSaveError(true);
    }
  }, [date, activeDay, historyDates]);

  const updateSet = (exIdx, setIdx, field, value) => {
    const newLog = { ...log };
    if (!newLog[exIdx]) newLog[exIdx] = {};
    if (!newLog[exIdx][setIdx]) newLog[exIdx][setIdx] = { weight: "", reps: "", done: false };
    newLog[exIdx][setIdx] = { ...newLog[exIdx][setIdx], [field]: value };
    persistLog(newLog);
  };

  const toggleSetDone = (exIdx, setIdx) => {
    const newLog = { ...log };
    if (!newLog[exIdx]) newLog[exIdx] = {};
    const current = newLog[exIdx][setIdx] || { weight: "", reps: "", done: false };
    newLog[exIdx][setIdx] = { ...current, done: !current.done };
    persistLog(newLog);
    if (!current.done) {
      const sec = restDurations[day.exercises[exIdx].name] || DEFAULT_REST_SEC;
      setRest({ date, dayId: activeDay, exIdx, setIdx, endAt: Date.now() + sec * 1000, alerted: false });
    } else if (rest && rest.exIdx === exIdx && rest.setIdx === setIdx) {
      setRest(null);
    }
  };

  // Shift the running rest by delta seconds and remember the new length for this exercise.
  const adjustRest = (delta) => {
    if (!rest) return;
    const name = day.exercises[rest.exIdx].name;
    const base = restDurations[name] || DEFAULT_REST_SEC;
    const nextLen = Math.max(15, base + delta);
    const newDurations = { ...restDurations, [name]: nextLen };
    setRestDurations(newDurations);
    try { localStorage.setItem("rest-durations", JSON.stringify(newDurations)); } catch (e) {}
    const endAt = Math.max(Date.now(), rest.endAt + (nextLen - base) * 1000);
    setRest({ ...rest, endAt, alerted: endAt <= Date.now() });
  };

  const restHere = rest && rest.date === date && rest.dayId === activeDay ? rest : null;
  const restRemaining = restHere ? Math.max(0, Math.ceil((restHere.endAt - now) / 1000)) : 0;

  const saveBodyWeight = async () => {
    const val = parseFloat(bwInput);
    if (!val || val <= 0) return;
    const newBw = { ...bodyWeights, [date]: val };
    setBodyWeights(newBw);
    setBwInput("");
    try { await storage.set("bodyweight-log", JSON.stringify(newBw)); } catch (e) {}
  };

  const totalSetsInDay = day.exercises.reduce((sum, ex) => sum + ex.sets, 0);
  const completedSets = useMemo(() => {
    if (!log) return 0;
    let count = 0;
    Object.values(log).forEach((ex) => Object.values(ex).forEach((s) => { if (s.done) count++; }));
    return count;
  }, [log]);

  const bwEntries = Object.entries(bodyWeights).sort(([a], [b]) => (a < b ? -1 : 1));

  return (
    <div style={styles.app}>
      <header style={styles.header}>
        <div style={styles.headerTop}>
          <IconWrap icon={Dumbbell} size={22} color="#D9A441" strokeWidth={2.5} />
          <h1 style={styles.title}>FOCUS &amp; FORM</h1>
        </div>
        <p style={styles.subtitle}>3-Day Upper / Lower / Full Body Split</p>
      </header>

      <nav style={styles.viewToggle}>
        <button onClick={() => setView("log")} style={{ ...styles.viewBtn, ...(view === "log" ? styles.viewBtnActive : {}) }}>
          <IconWrap icon={Calendar} size={15} color={view === "log" ? "#EDEAE3" : "#8A857A"} /> Log
        </button>
        <button onClick={() => setView("progress")} style={{ ...styles.viewBtn, ...(view === "progress" ? styles.viewBtnActive : {}) }}>
          <IconWrap icon={TrendingUp} size={15} color={view === "progress" ? "#EDEAE3" : "#8A857A"} /> Progress
        </button>
      </nav>

      {view === "log" && (
        <React.Fragment>
          <div style={styles.dateRow}>
            <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={styles.dateInput} />
            <span style={styles.dateLabel}>{formatDateLabel(date)}</span>
          </div>

          <div style={styles.tabs}>
            {DAYS.map((d) => (
              <button key={d.id} onClick={() => { setActiveDay(d.id); setExpanded(0); }}
                style={{ ...styles.tab, borderColor: d.color,
                  ...(activeDay === d.id ? { background: d.color, color: "#1C1B1A" } : { background: "transparent", color: d.color }) }}>
                <span style={styles.tabLabel}>{d.label}</span>
                <span style={styles.tabName}>{d.name}</span>
              </button>
            ))}
          </div>

          <div style={{ ...styles.dayHeader, borderColor: day.color }}>
            <div><div style={{ ...styles.dayFocus, color: day.color }}>{day.focus}</div></div>
            <div style={styles.progressBadge}>
              <div style={styles.progressText}>{completedSets}/{totalSetsInDay} sets</div>
              <div style={styles.progressBarTrack}>
                <div style={{ ...styles.progressBarFill, width: `${totalSetsInDay ? (completedSets / totalSetsInDay) * 100 : 0}%`, background: day.color }} />
              </div>
            </div>
          </div>

          {saveError && <div style={styles.errorBanner}>Couldn't save — your browser storage may be full or blocked.</div>}

          {loading ? (
            <div style={styles.loadingText}>Loading…</div>
          ) : (
            <div style={styles.exerciseList}>
              {day.exercises.map((ex, exIdx) => {
                const group = primaryMuscleGroup(ex.muscles);
                const barColor = MUSCLE_COLORS[group] || "#6B7280";
                const isOpen = expanded === exIdx;
                const exLog = (log && log[exIdx]) || {};
                const doneCount = Object.values(exLog).filter((s) => s.done).length;
                const exRest = restHere && restHere.exIdx === exIdx ? restHere : null;
                const restLen = restDurations[ex.name] || DEFAULT_REST_SEC;

                return (
                  <div key={exIdx} style={{ ...styles.exerciseCard, borderLeftColor: barColor }}>
                    <button style={styles.exerciseHeader} onClick={() => setExpanded(isOpen ? -1 : exIdx)}>
                      <div style={{ flex: 1, textAlign: "left" }}>
                        <div style={styles.exerciseName}>{exIdx + 1}. {ex.name}</div>
                        <div style={styles.exerciseMeta}>{ex.sets} × {ex.reps} &nbsp;·&nbsp; {ex.muscles}</div>
                      </div>
                      <div style={styles.exerciseRight}>
                        {exRest && !isOpen && (
                          <span style={{ ...styles.restMini, color: restRemaining === 0 ? "#D9A441" : "#B5B0A6" }}>
                            <IconWrap icon={Timer} size={13} color={restRemaining === 0 ? "#D9A441" : "#8A857A"} />
                            {restRemaining === 0 ? "Go" : formatClock(restRemaining)}
                          </span>
                        )}
                        <span style={{ ...styles.setBadge, color: barColor, borderColor: barColor }}>{doneCount}/{ex.sets}</span>
                        <IconWrap icon={isOpen ? ChevronUp : ChevronDown} size={18} color="#8A857A" />
                      </div>
                    </button>

                    {isOpen && (
                      <div style={styles.setsPanel}>
                        <div style={styles.setsHeaderRow}>
                          <span>Set</span><span>Weight (lb)</span><span>Reps</span><span>Done</span>
                        </div>
                        {Array.from({ length: ex.sets }).map((_, setIdx) => {
                          const s = exLog[setIdx] || { weight: "", reps: "", done: false };
                          const showRest = exRest && exRest.setIdx === setIdx;
                          const restOver = showRest && restRemaining === 0;
                          return (
                            <React.Fragment key={setIdx}>
                            <div style={styles.setRow}>
                              <span style={styles.setNum}>{setIdx + 1}</span>
                              <input type="number" inputMode="decimal" min="0" value={s.weight}
                                onChange={(e) => updateSet(exIdx, setIdx, "weight", e.target.value.replace(/-/g, ""))} style={styles.setInput} />
                              <input type="number" inputMode="numeric" placeholder={ex.reps} value={s.reps}
                                onChange={(e) => updateSet(exIdx, setIdx, "reps", e.target.value)} style={styles.setInput} />
                              <button onClick={() => toggleSetDone(exIdx, setIdx)}
                                style={{ ...styles.checkBtn, background: s.done ? barColor : "transparent", borderColor: barColor }}
                                aria-label={s.done ? "Mark set incomplete" : "Mark set complete"}>
                                {s.done && <IconWrap icon={Check} size={14} color="#1C1B1A" strokeWidth={3} />}
                              </button>
                            </div>
                            {showRest && (
                              <div style={{ ...styles.restRow, borderColor: restOver ? "#D9A441" : "#3A3835" }} role="timer" aria-live="polite">
                                <div style={styles.restTop}>
                                  <IconWrap icon={Timer} size={15} color={restOver ? "#D9A441" : barColor} />
                                  <span style={{ ...styles.restClock, color: restOver ? "#D9A441" : "#EDEAE3" }}>
                                    {restOver ? "REST OVER — GO" : formatClock(restRemaining)}
                                  </span>
                                  <div style={styles.restBtns}>
                                    <button style={styles.restBtn} onClick={() => adjustRest(-15)} aria-label="Shorten rest by 15 seconds">−15</button>
                                    <button style={styles.restBtn} onClick={() => adjustRest(15)} aria-label="Lengthen rest by 15 seconds">+15</button>
                                    <button style={styles.restBtn} onClick={() => setRest(null)}>{restOver ? "Done" : "Skip"}</button>
                                  </div>
                                </div>
                                <div style={styles.progressBarTrack}>
                                  <div style={{ ...styles.progressBarFill, transition: "width 0.25s linear",
                                    width: `${Math.min(100, (restRemaining / restLen) * 100)}%`, background: restOver ? "#D9A441" : barColor }} />
                                </div>
                              </div>
                            )}
                            </React.Fragment>
                          );
                        })}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}

          <div style={styles.notesCard}>
            <div style={styles.notesTitle}>Training Notes</div>
            <ul style={styles.notesList}>
              {TRAINING_NOTES.map((n, i) => <li key={i} style={styles.notesItem}>{n}</li>)}
            </ul>
          </div>
        </React.Fragment>
      )}

      {view === "progress" && (
        <div style={styles.progressView}>
          <div style={styles.bwCard}>
            <div style={styles.bwCardHeader}><IconWrap icon={Scale} size={16} color="#D9A441" /><span style={styles.bwCardTitle}>Body Weight</span></div>
            <div style={styles.bwInputRow}>
              <input type="date" value={date} onChange={(e) => setDate(e.target.value)} style={styles.dateInput} />
              <input type="number" inputMode="decimal" placeholder="lb" value={bwInput} onChange={(e) => setBwInput(e.target.value)} style={styles.bwInput} />
              <button onClick={saveBodyWeight} style={styles.bwSaveBtn}>Log</button>
            </div>
            {bwEntries.length === 0 ? (
              <div style={styles.emptyText}>No body weight entries yet. Log your first one above.</div>
            ) : <BodyWeightChart entries={bwEntries} />}
          </div>

          <div style={styles.historyCard}>
            <div style={styles.bwCardHeader}><IconWrap icon={Calendar} size={16} color="#D9A441" /><span style={styles.bwCardTitle}>Workout History</span></div>
            {historyDates.length === 0 ? (
              <div style={styles.emptyText}>No workouts logged yet. Complete a set to start your history.</div>
            ) : (
              <div style={styles.historyList}>
                {[...historyDates].sort((a, b) => (a.date < b.date ? 1 : -1)).slice(0, 20).map((h, i) => {
                  const d = DAYS.find((dd) => dd.id === h.dayId);
                  return (
                    <button key={i} onClick={() => { setDate(h.date); setActiveDay(h.dayId); setView("log"); }}
                      style={{ ...styles.historyRow, borderLeftColor: d.color }}>
                      <span style={styles.historyDate}>{formatDateLabel(h.date)}</span>
                      <span style={{ ...styles.historyDay, color: d.color }}>{d.name}</span>
                    </button>
                  );
                })}
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function BodyWeightChart({ entries }) {
  const weights = entries.map(([, w]) => w);
  const min = Math.min(...weights);
  const max = Math.max(...weights);
  const range = max - min || 1;
  const width = 300, height = 100, padding = 10;

  const points = entries.map(([, w], i) => {
    const x = entries.length > 1 ? (i / (entries.length - 1)) * (width - padding * 2) + padding : width / 2;
    const y = height - padding - ((w - min) / range) * (height - padding * 2);
    return `${x},${y}`;
  });

  const first = weights[0];
  const last = weights[weights.length - 1];
  const delta = last - first;

  return (
    <div>
      <svg width="100%" viewBox={`0 0 ${width} ${height}`} style={{ marginTop: 12 }}>
        <polyline points={points.join(" ")} fill="none" stroke="#D9A441" strokeWidth="2" />
        {entries.map(([, w], i) => {
          const [x, y] = points[i].split(",");
          return <circle key={i} cx={x} cy={y} r="3" fill="#D9A441" />;
        })}
      </svg>
      <div style={styles.bwSummary}>
        <span>{first} → {last} lb</span>
        <span style={{ color: delta <= 0 ? "#4A7856" : "#C4694F" }}>{delta > 0 ? "+" : ""}{delta.toFixed(1)} lb</span>
      </div>
    </div>
  );
}
